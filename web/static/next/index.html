<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#1f6f50" />
		<title>주소가 바뀌었다 · 훌라 연습장</title>
		<link rel="canonical" href="../" />
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7faf5;
				--fg: #181d19;
				--muted: #404943;
				--primary: #1f6f50;
				--on-primary: #fff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f1511;
					--fg: #dfe4dd;
					--muted: #bfc9c1;
					--primary: #8fd5b0;
					--on-primary: #003824;
				}
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				box-sizing: border-box;
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, sans-serif;
				line-height: 1.6;
			}
			main {
				max-width: 420px;
				display: grid;
				gap: 12px;
			}
			h1 {
				margin: 0;
				font-size: 1.375rem;
			}
			p {
				margin: 0;
				color: var(--muted);
			}
			a {
				justify-self: start;
				margin-top: 8px;
				padding: 10px 24px;
				border-radius: 999px;
				background: var(--primary);
				color: var(--on-primary);
				font-weight: 700;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main data-testid="moved">
			<h1>훌라 연습장 주소가 바뀌었다</h1>
			<p>미리보기가 끝나 정식 주소로 옮겼다. 기록과 진행 중인 판은 그대로 이어진다.</p>
			<p>앱으로 설치했다면 지금 앱을 지우고 새 주소에서 다시 설치한다.</p>
			<a href="../">새 주소로 가기</a>
		</main>
	</body>
</html>
