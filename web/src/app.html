<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#1f6f50" />
		<meta name="color-scheme" content="light dark" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>
			// 첫 그리기 전에 테마 적용 (src/lib/theme/apply.ts와 같은 규칙)
			(function () {
				var p = {};
				try {
					p = JSON.parse(localStorage.getItem('hoola-theme') || '{}');
				} catch (e) {}
				var t =
					p.theme === 'light' || p.theme === 'dark'
						? p.theme
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				var c =
					p.contrast === 'standard' || p.contrast === 'medium' || p.contrast === 'high'
						? p.contrast
						: matchMedia('(prefers-contrast: more)').matches
							? 'high'
							: 'standard';
				document.documentElement.dataset.theme = t;
				document.documentElement.dataset.contrast = c;
				// 언어 (src/lib/i18n/index.ts와 같은 규칙). 영어인데 사전이 아직 없으면 받을 때까지 가린다
				var l = null;
				var d = null;
				try {
					l = localStorage.getItem('hoola-lang');
					d = localStorage.getItem('hoola-lang-en');
				} catch (e) {}
				if (l === 'en') {
					document.documentElement.lang = 'en';
					if (!d) {
						document.documentElement.dataset.i18nPending = '';
						setTimeout(function () {
							delete document.documentElement.dataset.i18nPending;
						}, 3000);
					}
				}
			})();
		</script>
		<style>
			html[data-i18n-pending] body {
				visibility: hidden;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
