name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  bench:
    name: Simulation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p hoola-sim

      - name: 2인 Greedy vs Random (듀플리케이트)
        run: ./target/release/hoola-sim --players 2 --games 20000 --bots greedy,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 3인 Greedy vs Random x2 (듀플리케이트)
        run: ./target/release/hoola-sim --players 3 --games 10000 --bots greedy,random,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 2인 Greedy 셀프플레이 속도
        run: ./target/release/hoola-sim --players 2 --games 100000 --bots greedy --no-duplicate | tee -a "$GITHUB_STEP_SUMMARY"

  python:
    name: Python wheel (PyO3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/hoola-py

      - name: Format & Clippy (hoola-py)
        working-directory: crates/hoola-py
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build wheel
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release -m crates/hoola-py/Cargo.toml -o dist

      - name: Install wheel & pytest
        run: |
          python -m pip install dist/*.whl "pytest>=8"
          python -m pytest -q crates/hoola-py/tests

      - uses: actions/upload-artifact@v4
        with:
          name: hoola-wheel
          path: dist/*.whl

  lab:
    name: Strategy lab (P2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p hoola-lab

      - name: Run hypotheses
        run: ./target/release/hoola-lab --deals 8000 --out lab-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lab-results
          path: lab-results.md

  lab-friends:
    name: Friend persona lab
    # 무거운 실험: 수동 실행(gh workflow run ci.yml)일 때만
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p hoola-lab

      - name: Run friend experiments (테이블당 약 10만 판)
        run: ./target/release/hoola-lab --only F --deals 33334 --out friends-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: friends-results
          path: friends-results.md

  lab-search:
    name: L3 search headroom
    # 무거운 실험: 수동 실행(gh workflow run ci.yml)일 때만
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p hoola-lab

      - name: Run L3 probe
        run: ./target/release/hoola-lab --only L3 --deals 1000 --out search-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: search-results.md

  web:
    name: Web practice app (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build WASM (web)
        run: wasm-pack build crates/hoola-wasm --release --target web --out-dir ../../web/pkg --no-pack

      - name: Build WASM (node) & smoke test
        run: |
          wasm-pack build crates/hoola-wasm --release --target nodejs --out-dir ../../target/pkg-node --no-pack
          node web/test/node-smoke.cjs target/pkg-node

      - name: Browser smoke test (Chromium)
        working-directory: web/test
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node browser-smoke.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css _site/
          cp -r web/pkg _site/pkg
          rm -f _site/pkg/.gitignore
          ls -la _site _site/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: hoola-web
          path: _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/test/*.png
          if-no-files-found: ignore

  pages:
    name: Deploy GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
