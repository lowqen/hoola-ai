name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  bench:
    name: Simulation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p hoola-sim

      - name: 2인 Greedy vs Random (듀플리케이트)
        run: ./target/release/hoola-sim --players 2 --games 20000 --bots greedy,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 3인 Greedy vs Random x2 (듀플리케이트)
        run: ./target/release/hoola-sim --players 3 --games 10000 --bots greedy,random,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 2인 Greedy 셀프플레이 속도
        run: ./target/release/hoola-sim --players 2 --games 100000 --bots greedy --no-duplicate | tee -a "$GITHUB_STEP_SUMMARY"
