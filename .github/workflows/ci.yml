name: CI

on:
  push:
    # Dependabot 브랜치는 pull_request 실행만 (중복 방지)
    branches-ignore: ["dependabot/**"]
    # 문서만 바뀐 push는 건너뛴다. PR은 필수 체크가 멈추지 않게 항상 돌린다.
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      experiment:
        description: "수동 실험 (all | friends | search | belief | study = 변형 S1~S6 | stop5 = study + friends)"
        type: choice
        options: [all, friends, search, belief, study, stop5]
        default: all
      preset:
        description: "수동 실험 규칙 프리셋 (config/presets/*.toml)"
        type: choice
        options: [heads_up_stop5, offline_casual]
        default: heads_up_stop5

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소.
# 이벤트별로 그룹을 나눠, 수동 실험(workflow_dispatch)이 push 실행(배포)을 취소하지 않게 한다.
# 수동 실험끼리도 실험·프리셋이 다르면 서로 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.experiment }}-${{ inputs.preset }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Doc tests
        run: cargo test --locked --workspace --doc


  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  bench:
    name: Simulation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-sim

      - name: 2인 Greedy vs Random (듀플리케이트)
        run: ./target/release/hoola-sim --players 2 --games 20000 --bots greedy,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 3인 Greedy vs Random x2 (듀플리케이트)
        run: ./target/release/hoola-sim --players 3 --games 10000 --bots greedy,random,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 2인 Greedy 셀프플레이 속도
        run: ./target/release/hoola-sim --players 2 --games 100000 --bots greedy --no-duplicate | tee -a "$GITHUB_STEP_SUMMARY"

  python:
    name: Python wheel (PyO3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/hoola-py

      - name: Format & Clippy (hoola-py)
        working-directory: crates/hoola-py
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build wheel
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --locked --release -m crates/hoola-py/Cargo.toml -o dist

      - name: Install wheel & pytest
        run: |
          python -m pip install dist/*.whl "pytest>=8"
          python -m pytest -q crates/hoola-py/tests



      - uses: actions/upload-artifact@v7
        with:
          name: hoola-wheel
          path: dist/*.whl

  lab:
    name: Strategy lab (P2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: Run hypotheses
        run: ./target/release/hoola-lab --deals 8000 --out lab-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lab-results
          path: lab-results.md

  lab-friends:
    name: Friend persona lab
    # 무거운 실험: 수동 실행(gh workflow run ci.yml -f experiment=...)일 때만
    if: github.event_name == 'workflow_dispatch' && (inputs.experiment == 'all' || inputs.experiment == 'friends' || inputs.experiment == 'stop5')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: Run friend experiments (테이블당 약 10만 판)
        run: ./target/release/hoola-lab --only F --deals 33334 --preset "config/presets/${{ inputs.preset }}.toml" --out friends-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: friends-results
          path: friends-results.md

  lab-search:
    name: L3 search headroom
    # 무거운 실험: 수동 실행(gh workflow run ci.yml -f experiment=...)일 때만
    if: github.event_name == 'workflow_dispatch' && (inputs.experiment == 'all' || inputs.experiment == 'search')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: Run L3 probe
        run: ./target/release/hoola-lab --only L3 --deals 1000 --preset "config/presets/${{ inputs.preset }}.toml" --out search-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: search-results
          path: search-results.md

  lab-study:
    name: Variant study (S1~S6)
    # 수동 실행(gh workflow run ci.yml -f experiment=study|stop5 -f preset=...)일 때만.
    # 2인만 돈다. 10점 규칙 비교값은 같은 실행의 lab job(같은 시드)에서 얻는다.
    if: github.event_name == 'workflow_dispatch' && (inputs.experiment == 'all' || inputs.experiment == 'study' || inputs.experiment == 'stop5')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRESET: config/presets/${{ inputs.preset }}.toml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: S1 게임 모양 (H0, 셀프플레이 16,000판)
        run: ./target/release/hoola-lab --only H0 --players 2 --deals 8000 --preset "$PRESET" --out s1.md

      - name: S2 스톱 승률표 (H8) + 기준표 후보 (후보당 16,000판)
        run: |
          ./target/release/hoola-lab --only H8 --players 2 --deals 8000 --preset "$PRESET" --out s2-table.md
          ./target/release/hoola-lab --only S2 --players 2 --deals 8000 --preset "$PRESET" --out s2-rules.md

      - name: S3 등록 · S4 7 단독(H3) · S6 땡큐(H4) · S5 땡큐 위험(H5)·조각 보존 (S5는 후보당 32,000판)
        run: |
          for id in S3 H3 H4 H5; do
            ./target/release/hoola-lab --only "$id" --players 2 --deals 8000 --preset "$PRESET" --out "s-$id.md"
          done
          ./target/release/hoola-lab --only S5 --players 2 --deals 16000 --preset "$PRESET" --out s-S5.md

      - name: 결과 합치기
        run: cat s1.md s2-table.md s2-rules.md s-S3.md s-H3.md s-H4.md s-H5.md s-S5.md | tee study-results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: study-results
          path: study-results.md

  # 웹은 WASM을 한 번만 빌드해 아티팩트로 나누고, 검사·E2E·Lighthouse를 병렬 job으로 돌린다.
  # 필수 체크 이름("Web practice app (SvelteKit)")은 마지막 게이트 job이 이어받는다.
  wasm:
    name: Web WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: wasm-pack@0.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build WASM → static/pkg
        run: |
          wasm-pack build crates/hoola-wasm --release --target web --out-dir ../../web/static/pkg --no-pack -- --locked
          rm -f web/static/pkg/.gitignore

      - name: WASM 바인딩 스모크 (Node)
        run: |
          wasm-pack build crates/hoola-wasm --release --target nodejs --out-dir ../../target/pkg-node --no-pack -- --locked
          node crates/hoola-wasm/tests/node-smoke.cjs target/pkg-node

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: web/static/pkg
          retention-days: 1

  web-check:
    name: Web check & build
    needs: [wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /hoola-ai
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/static/pkg

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Design tokens (최신 여부 + 6개 테마 명암 대비)
        run: npm run tokens:check

      - name: Icon sprite (최신 여부)
        run: npm run icons:check

      - name: Type check & format
        run: |
          npm run check
          npm run lint

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: hoola-web
          path: web/build

  e2e:
    name: Web E2E (${{ matrix.shard }}/2)
    needs: [wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BASE_PATH: /hoola-ai
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/static/pkg

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # webServer가 빌드 후 vite preview를 띄운다 (playwright.config.ts)
      - name: E2E (Chromium)
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (${{ matrix.name }})
    needs: [wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 페이지 6개 × 3회를 job 3개로 나눈다. URL 목록은 lighthouserc.json의 것을 덮어쓴다.
      matrix:
        include:
          - name: home·theme
            urls: --collect.url=http://localhost:4174/hoola-ai/ --collect.url=http://localhost:4174/hoola-ai/theme/
          - name: gallery·motion
            urls: --collect.url=http://localhost:4174/hoola-ai/gallery/ --collect.url=http://localhost:4174/hoola-ai/motion/
          - name: train·records
            urls: --collect.url=http://localhost:4174/hoola-ai/train/ --collect.url=http://localhost:4174/hoola-ai/records/
    env:
      BASE_PATH: /hoola-ai
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: web/static/pkg

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Lighthouse (모바일, 중앙값)
        run: npx -y @lhci/cli@0.16.0 autorun ${{ matrix.urls }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-${{ strategy.job-index }}
          path: web/.lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  web:
    name: Web practice app (SvelteKit)
    # 필수 체크. 앞 job이 실패하거나 취소되면 이 job도 실패해야 하므로 always()로 돌린다
    # (건너뛴 job은 필수 체크에서 통과로 친다).
    needs: [wasm, web-check, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 웹 job 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  pages:
    name: Deploy GitHub Pages
    # Rust 검사(test, fmt·clippy)가 실패해도 배포하지 않는다
    needs: [test, lint, web]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' && needs.lint.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # /next/는 옛 미리보기 주소를 정리하는 안내 페이지다 (web/static/next/)
      - uses: actions/download-artifact@v8
        with:
          name: hoola-web
          path: site

      - run: ls -la site site/next

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
