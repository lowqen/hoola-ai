name: CI

on:
  push:
    # Dependabot 브랜치는 pull_request 실행만 (중복 방지)
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      experiment:
        description: "수동 실험 (all | friends | search | belief)"
        type: choice
        options: [all, friends, search, belief]
        default: all

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소.
# 이벤트별로 그룹을 나눠, 수동 실험(workflow_dispatch)이 push 실행(배포)을 취소하지 않게 한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Doc tests
        run: cargo test --locked --workspace --doc


  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  bench:
    name: Simulation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-sim

      - name: 2인 Greedy vs Random (듀플리케이트)
        run: ./target/release/hoola-sim --players 2 --games 20000 --bots greedy,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 3인 Greedy vs Random x2 (듀플리케이트)
        run: ./target/release/hoola-sim --players 3 --games 10000 --bots greedy,random,random | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 2인 Greedy 셀프플레이 속도
        run: ./target/release/hoola-sim --players 2 --games 100000 --bots greedy --no-duplicate | tee -a "$GITHUB_STEP_SUMMARY"

  python:
    name: Python wheel (PyO3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/hoola-py

      - name: Format & Clippy (hoola-py)
        working-directory: crates/hoola-py
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build wheel
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --locked --release -m crates/hoola-py/Cargo.toml -o dist

      - name: Install wheel & pytest
        run: |
          python -m pip install dist/*.whl "pytest>=8"
          python -m pytest -q crates/hoola-py/tests



      - uses: actions/upload-artifact@v7
        with:
          name: hoola-wheel
          path: dist/*.whl

  lab:
    name: Strategy lab (P2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: Run hypotheses
        run: ./target/release/hoola-lab --deals 8000 --out lab-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lab-results
          path: lab-results.md

  lab-friends:
    name: Friend persona lab
    # 무거운 실험: 수동 실행(gh workflow run ci.yml -f experiment=...)일 때만
    if: github.event_name == 'workflow_dispatch' && (inputs.experiment == 'all' || inputs.experiment == 'friends')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: Run friend experiments (테이블당 약 10만 판)
        run: ./target/release/hoola-lab --only F --deals 33334 --out friends-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: friends-results
          path: friends-results.md

  lab-search:
    name: L3 search headroom
    # 무거운 실험: 수동 실행(gh workflow run ci.yml -f experiment=...)일 때만
    if: github.event_name == 'workflow_dispatch' && (inputs.experiment == 'all' || inputs.experiment == 'search')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p hoola-lab

      - name: Run L3 probe
        run: ./target/release/hoola-lab --only L3 --deals 1000 --out search-results.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: search-results
          path: search-results.md

  web:
    name: Web practice app (SvelteKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_PATH: /hoola-ai
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: wasm-pack@0.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM → static/pkg
        working-directory: .
        run: |
          wasm-pack build crates/hoola-wasm --release --target web --out-dir ../../web/static/pkg --no-pack -- --locked
          rm -f web/static/pkg/.gitignore

      - name: WASM 바인딩 스모크 (Node)
        working-directory: .
        run: |
          wasm-pack build crates/hoola-wasm --release --target nodejs --out-dir ../../target/pkg-node --no-pack -- --locked
          node crates/hoola-wasm/tests/node-smoke.cjs target/pkg-node

      - name: Install
        run: npm ci

      - name: Design tokens (최신 여부 + 6개 테마 명암 대비)
        run: npm run tokens:check

      - name: Icon sprite (최신 여부)
        run: npm run icons:check

      - name: Type check & format
        run: |
          npm run check
          npm run lint

      - name: Build
        run: npm run build

      - name: E2E (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Lighthouse (모바일, 중앙값)
        run: npx -y @lhci/cli@0.16.0 autorun

      - uses: actions/upload-artifact@v7
        with:
          name: hoola-web
          path: web/build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-reports
          path: |
            web/.lighthouseci
            web/playwright-report
          include-hidden-files: true
          if-no-files-found: ignore

  pages:
    name: Deploy GitHub Pages
    needs: [web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # /next/는 옛 미리보기 주소를 정리하는 안내 페이지다 (web/static/next/)
      - uses: actions/download-artifact@v8
        with:
          name: hoola-web
          path: site

      - run: ls -la site site/next

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
